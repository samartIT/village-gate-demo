<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Village Gate demo</title><meta name="village-gate-demo" content="built 2026-10-31T18:19"><meta name="theme-color" content="#1f2a33"><style>
/* Village Gate v2. Base styles from the prototype, v2 additions at the end. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface2:#F4F6F8; --line:#D4DBE2; --ink:#17212B; --muted:#5A6676;
  --asphalt:#252A31; --asphalt-ink:#E8ECF0; --asphalt-muted:#9BA6B2;
  --paint:#F2C318; --paint-ink:#1E1A08;
  --ok:#1B7C45; --ok-bg:#DCF1E4; --busy:#33579C; --busy-bg:#E0E8F6; --over:#B9590C; --over-bg:#FBE8D3; --bad:#BC2D23; --bad-bg:#FBE0DC;
  --on-tone:#FFFFFF; --on-busy:#FFFFFF; --shadow:0 18px 50px rgba(20,30,42,.16);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151A; --surface:#191F26; --surface2:#20272F; --line:#2D3640; --ink:#E5EAEF; --muted:#97A3B0;
    --asphalt:#0B0E12; --asphalt-ink:#E5EAEF; --asphalt-muted:#8E99A6;
    --ok:#4CC383; --ok-bg:#163424; --busy:#86A8EA; --busy-bg:#1B2943; --over:#F2A257; --over-bg:#3B2715; --bad:#F37A6F; --bad-bg:#3F1D1A;
    --on-tone:#0E1317; --on-busy:#0E1317; --shadow:0 18px 50px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151A; --surface:#191F26; --surface2:#20272F; --line:#2D3640; --ink:#E5EAEF; --muted:#97A3B0;
  --asphalt:#0B0E12; --asphalt-ink:#E5EAEF; --asphalt-muted:#8E99A6;
  --ok:#4CC383; --ok-bg:#163424; --busy:#86A8EA; --busy-bg:#1B2943; --over:#F2A257; --over-bg:#3B2715; --bad:#F37A6F; --bad-bg:#3F1D1A;
  --on-tone:#0E1317; --on-busy:#0E1317; --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--asphalt)}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{line-height:1.25;margin:0}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--paint);outline-offset:2px}
.muted{color:var(--muted)} .sm{font-size:13px} .nowrap{white-space:nowrap} .center{text-align:center}
.err{color:var(--bad);font-size:14px;font-weight:500;min-height:0}
.err:empty{display:none}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--asphalt);color:var(--asphalt-ink);display:flex;align-items:center;gap:14px 20px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.mark{flex:none;width:7px;height:34px;border-radius:1px;background:repeating-linear-gradient(180deg,var(--paint) 0 11px,transparent 11px 17px)}
.brand strong{display:block;font-size:17px;font-weight:700;letter-spacing:.01em}
.brand span{display:block;font-size:12.5px;color:var(--asphalt-muted)}
.roles{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.07);padding:4px;border-radius:10px}
.roles .demo{font-size:12px;color:var(--asphalt-muted);padding:0 8px 0 6px}
.roles button{appearance:none;border:0;background:transparent;color:#C8D0D9;font-size:14.5px;font-weight:500;padding:7px 14px;border-radius:7px;cursor:pointer;position:relative}
.roles button:hover{color:#fff}
.roles button[aria-pressed="true"]{background:var(--paint);color:var(--paint-ink);font-weight:600}
.roles .rb{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
[data-theme="dark"] .roles .rb{color:#fff}
.clockbox{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.clockbox button{appearance:none;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--asphalt-ink);font-size:12px;border-radius:6px;padding:3px 8px;cursor:pointer}
.lang{display:flex;gap:2px;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:2px}
.lang button{appearance:none;border:0;background:transparent;color:#C8D0D9;font-size:13px;font-weight:600;padding:4px 9px;border-radius:6px;cursor:pointer;line-height:1.2}
.lang button[aria-pressed="true"]{background:var(--asphalt-ink);color:var(--asphalt)}
.clockbox #clock{min-width:3.2em;text-align:right}
:lang(th) body,html:lang(th) body{line-height:1.6}
html:lang(th) .stat .k,html:lang(th) th{letter-spacing:0}
@media (max-width:760px){
  .top{gap:10px}
  .roles{order:3;width:100%;overflow-x:auto}
  .roles .demo{display:none}
  .roles button{flex:1;padding:8px 6px}
}

/* layout */
.app{max-width:1380px;margin:0 auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.panel.flush{padding:0;overflow:hidden}
.panel.flush .ph.pad{padding:14px 18px 0}
.panel h2{font-size:16px;font-weight:600}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pane-head{margin-bottom:16px}
.pane-head h1{font-size:25px;font-weight:700;letter-spacing:-.01em}
.pane-head .sub{color:var(--muted);margin-top:2px;max-width:70ch}

/* buttons, chips, plates */
.btn{appearance:none;font-size:14px;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.3;text-decoration:none;color:var(--ink);background:transparent}
.btn.ink{background:var(--ink);color:var(--surface)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.tone{background:var(--tone);color:var(--on-tone)}
.btn.danger.ink{background:var(--bad);color:var(--on-tone)}
.btn.ghost.danger{color:var(--bad)}
.btn.big{font-size:18px;padding:13px 24px;min-height:54px;border-radius:10px}
.btn.sm{font-size:13px;padding:5px 10px;border-radius:7px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.link{appearance:none;background:none;border:0;padding:0;font-size:inherit;color:var(--busy);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.chip.s-available,.chip.d-in{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.s-full,.chip.info,.chip.d-move{background:var(--busy-bg);color:var(--busy);border-color:transparent}
.chip.s-overflow{background:var(--over-bg);color:var(--over);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.plate{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#111;border:1.5px solid #1b1b1b;border-radius:5px;padding:1px 8px 2px;line-height:1.15;min-width:86px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px #cfcfcf;white-space:nowrap;vertical-align:middle;flex:none}
.plate b{font-weight:700;font-size:15px}
.plate i{font-style:normal;font-size:9.5px;color:#333}
.plate.sm{min-width:74px;padding:1px 6px}
.plate.sm b{font-size:13px}
.plate.lg{min-width:190px;padding:5px 18px 7px;border-width:2.5px;border-radius:9px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4.5px #cfcfcf;justify-self:start}
.plate.lg b{font-size:34px;letter-spacing:.01em}
.plate.lg i{font-size:14px}
.code{font-weight:600;letter-spacing:.04em}
.code.big{font-size:20px}

/* forms */
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--paint)}
textarea{resize:vertical;font-size:13px;line-height:1.45}
label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
label.check{display:flex;align-items:flex-start;gap:9px;color:var(--ink);font-size:14px;font-weight:400}
label.check input{width:auto;margin:3px 0 0;accent-color:var(--ink)}
label.plain{color:var(--ink);font-size:14px}
.form,.stack{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset.radios{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:grid;gap:6px}
fieldset.radios legend{font-size:13px;color:var(--muted);padding:0 4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input{max-width:280px}
.filters select{width:auto}
@media (max-width:560px){.f2{grid-template-columns:1fr}.filters input{max-width:none}}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row-bad td{background:var(--bad-bg)}
.qsel{width:auto;padding:3px 6px;font-size:14px}
.more{padding:12px;text-align:center;border-top:1px solid var(--line)}
table.fmt td,table.fmt th{font-size:13px;padding:6px 10px}

/* admin */
.admin{display:grid;grid-template-columns:196px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px}
.side button{appearance:none;border:0;border-left:3px solid transparent;background:transparent;text-align:left;font-size:14.5px;color:var(--muted);padding:9px 12px;border-radius:0 8px 8px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side button:hover{color:var(--ink)}
.side button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;border-left-color:var(--paint)}
.dot{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700;line-height:18px}
.dot.info{background:var(--busy);color:var(--on-busy)}
@media (max-width:900px){
  .admin{grid-template-columns:1fr;gap:14px}
  .side{position:static;flex-direction:row;overflow-x:auto;border-bottom:1px solid var(--line)}
  .side button{border-left:0;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap}
  .side button[aria-current="page"]{border-bottom-color:var(--paint);background:transparent}
}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.stat{padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:600;line-height:1.1}
.stat .v small{font-size:14px;font-weight:500;color:var(--muted)}
.stat .d{font-size:13px;color:var(--muted)}
.stat.is-bad .v{color:var(--bad)}
@media (max-width:1100px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:620px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(4){border-left:1px solid var(--line)}.stat:nth-child(odd){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.meter{display:block;width:100%;height:6px;margin-top:6px}
.meter .mt{fill:var(--surface2);stroke:var(--line);stroke-width:.4}
.meter .mf{fill:var(--busy)}
.meter.m-warn .mf{fill:var(--over)} .meter.m-bad .mf{fill:var(--bad)}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.ov-grid .panel{margin-bottom:18px}
@media (max-width:1150px){.ov-grid{grid-template-columns:1fr;gap:0}}

/* village map */
/* village map: fixed 28 px cells, 10 per row per soi, soi blocks side by side and wrapping (300 houses fit one screen at 1366 px) */
.vmap{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-start}
.zone{flex:none}
.zone h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(10,28px);gap:3px}
.tile{appearance:none;border:0;padding:0;width:28px;height:28px;border-radius:3px;font-size:10px;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center}
.tile.s-available{background:var(--ok-bg);color:var(--ok)}
.tile.s-full{background:var(--busy);color:var(--on-busy)}
.tile.s-overflow{background:repeating-linear-gradient(135deg,var(--over) 0 2.5px,var(--over-bg) 2.5px 5.5px);color:var(--ink)}
.tile.s-overflow span{background:var(--surface);border-radius:2px;padding:1px 2px}
.tile:hover{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.map-legend{margin-top:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:-8px}
.t-available{background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok)} .t-full{background:var(--busy)} .t-overflow{background:repeating-linear-gradient(135deg,var(--over) 0 2px,var(--over-bg) 2px 4px)}
.sw-in{background:var(--busy)} .sw-out{background:var(--muted);opacity:.55}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .b-in{fill:var(--busy)} .chart .b-out{fill:var(--muted);opacity:.55}
.attn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.attn li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border-left:4px solid var(--lv);background:var(--surface2)}
.attn .ai{display:flex;gap:10px;align-items:flex-start;min-width:0}
.attn strong{font-size:14px}
.attn p{font-size:13.5px;color:var(--muted)}
.lv-bad{--lv:var(--bad)} .lv-warn{--lv:var(--over)} .lv-info{--lv:var(--busy)} .lv-ok{--lv:var(--ok)} .lv-over{--lv:var(--bad)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows li>span:nth-child(2){flex:1;min-width:0}
.rows .btns{display:flex;gap:8px}
.imp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.imp-grid .panel h2{margin-bottom:10px}
.imp-grid .panel>p{margin-bottom:10px}
@media (max-width:1100px){.imp-grid{grid-template-columns:1fr}}
pre.sample{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:12.5px;margin:12px 0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"IBM Plex Sans Thai",monospace}
.report{margin-top:16px;border:1px solid var(--line);border-left:4px solid var(--busy);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.report.ok{border-left-color:var(--ok)}
.report h3{font-size:15px} .report h4{font-size:13px;margin-top:6px}
.issues{margin:0;padding-left:18px;font-size:13px;max-height:220px;overflow:auto}
.issues.bad li{color:var(--bad)}
.filetag{font-size:13px;background:var(--surface2);border-radius:6px;padding:6px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0 4px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* parking bays */
.bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.bay{border:2px dashed var(--line);border-radius:10px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px;font-size:12px;color:var(--muted);text-align:center}
.bay.used{border-style:solid;border-color:var(--busy);background:var(--busy-bg);color:var(--busy)}
.bay.free{border-color:var(--ok);color:var(--ok);font-weight:600;font-size:14px}
.bay.temp{border-style:solid;border-color:var(--over);color:var(--over);background:repeating-linear-gradient(135deg,var(--over-bg) 0 7px,var(--surface) 7px 14px);font-weight:600}
.tempzone{margin-top:10px}
.tempzone>p{font-size:13px;font-weight:600;color:var(--over);margin-bottom:6px}

/* guard */
.guard{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr);gap:24px;align-items:start}
@media (max-width:960px){.guard{grid-template-columns:1fr}}
.gate-head{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:16px}
.gate-head h1{font-size:26px;font-weight:700}
.biglabel{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
.searchrow{display:flex;gap:10px}
.searchrow .bigin{flex:1}
.searchrow .btn{flex:none}
.bigin{font-size:30px;font-weight:600;padding:12px 16px;border:2px solid var(--line);border-radius:12px;letter-spacing:.02em}
@media (max-width:520px){.bigin{font-size:24px}.bigin::placeholder{font-size:17px}}
.bigin::placeholder{font-weight:400;font-size:22px;color:var(--muted);opacity:.8}
.midin{font-size:22px;font-weight:600;padding:8px 12px;max-width:320px}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.ghint{margin-top:18px;padding:16px 18px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);display:grid;gap:6px}
.matches{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.mrow{appearance:none;width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px;text-align:left;cursor:pointer}
.mrow>span:nth-child(2){flex:1;min-width:0}
.mrow.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.mrow:hover{border-color:var(--muted)}
.pickhint{margin-top:10px}
.tone-ok{--tone:var(--ok);--tone-bg:var(--ok-bg)} .tone-over{--tone:var(--over);--tone-bg:var(--over-bg)} .tone-bad{--tone:var(--bad);--tone-bg:var(--bad-bg)} .tone-info{--tone:var(--busy);--tone-bg:var(--busy-bg)} .tone-neutral{--tone:var(--ink);--tone-bg:var(--surface2)}
.decision{background:var(--surface);border:2px solid var(--tone);border-radius:14px;overflow:hidden;margin-top:14px;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
.decision .dt{background:var(--tone-bg);color:var(--tone);display:flex;align-items:center;gap:12px;padding:14px 18px}
.decision .dt h2{font-size:22px;font-weight:700}
.decision .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--tone);color:var(--on-tone);display:grid;place-items:center}
.decision .ic svg{width:22px;height:22px}
.decision .db{padding:16px 18px;display:grid;gap:9px;font-size:15.5px}

}
.vname{display:block;font-size:12px;color:var(--asphalt-muted)}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}.fgrid .wide{grid-column:1/-1}
.f-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center}.check.strong{font-weight:600;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.btn.left{margin-right:auto}
.photo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-prev img{max-height:120px;max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.ph-thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.pcell{display:flex;gap:8px;align-items:center}
.difflist{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.difflist li{display:flex;justify-content:space-between;gap:16px;padding:8px 10px;background:var(--surface2);border-radius:8px;font-size:14px}
.difflist li.sub{display:block;background:none;padding:0 10px;color:var(--muted)}
.errlist{margin:8px 0;padding-left:20px;font-size:14px;max-height:280px;overflow:auto}
.impbox{margin-top:12px;display:grid;gap:10px}
.qrbox{width:200px;max-width:100%;background:#fff;border-radius:10px;padding:6px}.qrbox svg{display:block;width:100%;height:auto}
.panel.hl{border-color:var(--over);box-shadow:0 0 0 3px var(--over-bg)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.ph h2{margin:0}
.more{padding:12px;text-align:center}.pad{padding:16px}
pre.code{background:var(--surface2);border-radius:8px;padding:10px 12px;overflow:auto;font-size:13px}
.callout.ok{background:var(--ok-bg)}.callout.info{background:var(--busy-bg)}.callout.warn{background:var(--over-bg)}.callout.bad{background:var(--bad-bg)}.callout ul{margin:0;padding-left:20px}
.chip.k-guest{background:var(--over-bg);color:var(--over)}.chip.k-delivery{background:var(--busy-bg);color:var(--busy)}.chip.k-service{background:var(--ok-bg);color:var(--ok)}
.guard{display:block;max-width:1100px;margin:0 auto}
.gsearch{display:grid;gap:10px;margin-bottom:6px}
.gsearch input{font-size:24px;padding:14px 16px;border-radius:14px;letter-spacing:.04em;width:100%}
.gsearch .btnrow{margin-top:0}.gsearch .btnrow .btn{flex:1;min-height:48px}
.gres{min-height:40px}.ghint{margin:12px 2px}
.dplate{margin:4px 0 10px}.dplate .plate{font-size:1.25em}
.gpl{display:grid;gap:6px;margin-top:8px}
.gcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:18px}.gcols>.panel{margin-bottom:0}
.glist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.glist li{padding:10px;border-radius:10px;background:var(--surface2);display:grid;gap:6px;box-shadow:inset 4px 0 0 transparent}
.glist li.lv-warn{box-shadow:inset 4px 0 0 var(--over)}.glist li.lv-over{box-shadow:inset 4px 0 0 var(--bad);background:var(--bad-bg)}
.gl1,.gl2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.gl2{justify-content:space-between;font-size:14px}
.gfoot{margin-top:18px;text-align:center}
@media (max-width:760px){
  .admin{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;-webkit-overflow-scrolling:touch}.side button{white-space:nowrap;flex:none}.side-foot{display:none}
  .f3{grid-template-columns:1fr}.topright{gap:8px}.gsearch input{font-size:20px}.who #whoName{display:none}
}

</style></head>

function dt(s) {
  if (s == null) return '';
  s = String(s);
  if (LANG !== 'th') return s === 'Not given' ? '' : s;
  if (s in DATA_TH) return DATA_TH[s];
  let m;
  if ((m = s.match(/^Resident of (.+)$/))) return 'ลูกบ้าน ' + m[1];
  if ((m = s.match(/^([A-Za-z]+) ([A-Z])\.$/)) && FIRST_TH[m[1]]) return FIRST_TH[m[1]] + ' ' + (INIT_TH[m[2]] || m[2]) + '.';
  return s;
}
/* params for stored messages: format times and durations now, translate known data, escape the rest */
function tm(k, p) {
  const o = {};
  for (const [key, v] of Object.entries(p || {})) {
    if ((key === 'at' || key === 'until') && typeof v === 'number') o[key] = fmtT(v);
    else if ((key === 'over' || key === 'd') && typeof v === 'number') o[key] = v > 0 ? fmtDur(v) : '';
    else if (key === 'name' || key === 'reason' || key === 'owner') o[key] = esc(dt(v));
    else o[key] = typeof v === 'string' ? esc(v) : v;
  }
  return t(k, o);
}

/* ================= formatting (language aware) ================= */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function fmtT(t) { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayKey(t) { const d = new Date(t); return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate(); }
/* dates are day month year everywhere: "30 Oct 2026" in English, "30 ต.ค. 2569" (Buddhist year) in Thai */
const yearOf = y => (LANG === 'th' ? y + 543 : y);
function fmtD(ts) { const d = new Date(ts); return `${d.getDate()} ${(LANG === 'th' ? MON_TH : MON)[d.getMonth()]} ${yearOf(d.getFullYear())}`; }
function fmtDay(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? `${+m[3]} ${(LANG === 'th' ? MON_TH : MON)[+m[2] - 1]} ${yearOf(+m[1])}` : String(iso || ''); }
function fmtDT(ts) {
  const n = now();
  if (dayKey(ts) === dayKey(n)) return t('tm.today') + ' ' + fmtT(ts);
  if (dayKey(ts) === dayKey(n - DAY)) return t('tm.yesterday') + ' ' + fmtT(ts);
  if (dayKey(ts) === dayKey(n + DAY)) return t('tm.tomorrow') + ' ' + fmtT(ts);
  return fmtD(ts) + ' ' + fmtT(ts);
}
function fmtDur(ms) {
  ms = Math.max(0, ms); const m = Math.floor(ms / MIN), th = LANG === 'th';
  if (m < 60) return th ? `${m} นาที` : m + 'm';
  const h = Math.floor(m / 60);
  if (h < 48) return th ? `${h} ชม. ${m % 60} นาที` : h + 'h ' + pad(m % 60) + 'm';
  return th ? `${Math.floor(h / 24)} วัน ${h % 24} ชม.` : Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
const fmtNum = n => Number(n).toLocaleString('en-US');
function carDesc(v) { return t('car', { color: esc(dt(v.color)), model: esc(dt(v.model)) }); }

function villageName() { return LANG === 'th' ? (S.settings.villageNameTh || dt(S.settings.villageName)) : S.settings.villageName; }
function areaLabel() { return LANG === 'th' ? (S.settings.areaLabelTh || 'ซอย') : (S.settings.areaLabel || 'Soi'); }
function areaName(a) {
  const s = String(a ?? ''), en = String(S.settings.areaLabel || '').toLowerCase(), th = String(S.settings.areaLabelTh || '');
  if ((en && s.toLowerCase().startsWith(en)) || (th && s.startsWith(th))) return s;
  return `${areaLabel()} ${s}`;
}

      if (!slot) { D.visNoSlot++; if (fx) addAlert('warning', 'visfull', { plate: ev.plate }, ev.plate, home, ev.t); }
    } else loc = ev.type === 'service' ? 'service' : 'moving';
    D.pres.set(k, { plate: ev.plate, prov: ev.prov || '', home, type: ev.type, since: ev.t, loc, slot, pass: ev.pass || null });
    ev.loc = loc; ev.slot = slot;
    if (ev.type !== 'member' && ev.pass && D.pass[ev.pass]) {

      if (fx && ev.type === 'guest' && p.home) notify(p.home, 'n.arrived', { name: p.name || '', plate: ev.plate, at: ev.t, until: deadlineOf(p) }, ev.t);
    }

  }
  if (ev.dir === 'out') {
    if (!cur) return { missing: true };
    D.pres.delete(k); ev.loc = cur.loc; ev.slot = cur.slot; ev.dur = ev.t - cur.since;
    if (cur.loc === 'home') D.atHome[cur.home] = Math.max(0, (D.atHome[cur.home] || 0) - 1);
    if (cur.loc === 'temp') { D.tempN[cur.home] = Math.max(0, (D.tempN[cur.home] || 0) - 1); if (cur.slot) releaseSlot(D.temp, cur.slot); else D.tempNoSlot = Math.max(0, D.tempNoSlot - 1); }
    if (cur.loc === 'visitor') { if (cur.slot) releaseSlot(D.vis, cur.slot); else D.visNoSlot = Math.max(0, D.visNoSlot - 1); }
    let freedFor = null;
    if (cur.type === 'member' && cur.loc === 'home') {
      const waiting = tempCarsOf(cur.home);
      if (waiting.length) { freedFor = waiting[0]; if (fx) notify(cur.home, 'n.space', { plate: waiting[0].plate, slot: waiting[0].slot || 'T' }, ev.t); }
    }

      const p = D.pass[cur.pass]; const over = ev.t - deadlineOf(p); p.status = 'exited'; p.exitAt = ev.t;
      if (fx && cur.type === 'guest' && p.home) notify(p.home, 'n.left', { name: p.name || '', plate: cur.plate, at: ev.t, over: over > 0 ? over : 0 }, ev.t);

  if (ev.dir === 'move') {
    if (!cur || cur.loc !== 'temp' || (D.atHome[cur.home] || 0) >= quotaOf(cur.home)) return { noop: true };

    D.atHome[cur.home] = (D.atHome[cur.home] || 0) + 1;
    return { cur };
  }
  return { noop: true };
}

const REPORT_KEYS = ['setup', 'settings', 'block', 'unblock', 'approve', 'reject', 'rejectdup', 'phone', 'link', 'unreg', 'homeedit', 'homeadd', 'homedel', 'import', 'importundo', 'export', 'quota', 'correct', 'deny', 'vehadd', 'vehedit', 'svcadd', 'svcedit', 'svcdel', 'svcforce', 'useradd', 'userreset', 'useroff', 'useron', 'devok', 'devno', 'devrevoke', 'backup', 'pwchange', 'totpon', 'totpoff', 'purge'];

function buildReport(d) {
  const { s, e, T, evs } = d, hourly = Array.from({ length: 24 }, () => ({ in: 0, out: 0 }));
  for (const x of evs) { const h = new Date(x.t).getHours(); if (x.dir === 'in') hourly[h].in++; else if (x.dir === 'out') hourly[h].out++; }
  let busiest = { h: -1, n: 0 }; hourly.forEach((v, h) => { if (v.in + v.out > busiest.n) busiest = { h, n: v.in + v.out }; });
  const ins = evs.filter(x => x.dir === 'in'), outs = evs.filter(x => x.dir === 'out'), visits = d.visits;
  const overs = visits.map(p => ({ p, over: Math.min(p.exitAt ?? T, T) - deadlineOf(p) })).filter(x => x.over > 0);
  const stays = visits.filter(p => p.exitAt).map(p => p.exitAt - p.entryAt), avgStay = stays.length ? stays.reduce((a, b) => a + b, 0) / stays.length : 0;
  const incidents = d.alerts.map(a => ({ t: a.t, kind: a.kind, plate: a.plate || '', home: a.home || '', text: stripTags(tm('al.' + a.kind, a.p)), handled: !!a.ack }));
  for (const x of ins) if (x.type === 'member' && x.plate && !D.veh[pk(x.plate)]) incidents.push({ t: x.t, kind: 'noreg', plate: x.plate, home: '', text: t('sec.d.noreg', { by: dt(x.by || '') }), handled: !D.pres.has(pk(x.plate)) });
  incidents.sort((a, b) => a.t - b.t);
  return { day: d.day, s, e, T, evs, hourly, busiest, entries: ins.length, exits: outs.length, unique: new Set(evs.filter(x => x.dir !== 'move' && x.plate).map(x => pk(x.plate))).size,
    members: ins.filter(x => x.type === 'member').length, guestsIn: ins.filter(x => x.type !== 'member').length, visits, walkins: visits.filter(p => p.createdBy === 'guard' && kindOf(p) === 'guest').length,
    invited: visits.filter(p => p.createdBy === 'member' || p.createdBy === 'admin').length, deliveries: visits.filter(p => p.kind === 'delivery').length, services: visits.filter(p => p.kind === 'service').length,
    overs, avgStay, incidents, snap: d.snap || { members: 0, guests: 0, peak: 0, over: [], unauthorized: 0, missing: true }, actions: d.audit.filter(a => REPORT_KEYS.includes(a.a)), partial: d.partial, note: d.note || '' };
}
AVIEWS.reports = () => {

function reportView(r) {

function guardLive() {
  const q = readQ(), fails = readQ(QFAIL), vis = visitorsInside(), exp = S.passes.filter(passValid).sort((a, b) => a.expectUntil - b.expectUntil).slice(0, 12);
  return `${!ONLINE || q.length ? `<div class="callout ${ONLINE ? 'info' : 'warn'}"><strong>${t(ONLINE ? 'off.sending2' : 'off.title', { n: q.length })}</strong> ${t(ONLINE ? 'off.sending.p' : 'off.p')}</div>` : ''}
  ${fails.length ? `<div class="callout bad"><strong>${t('off.fail', { n: fails.length })}</strong><ul>${fails.map(f => `<li>${fmtT(f.at)} ${esc(f.p.plate || f.p.code || '')}: ${t(f.error, escAll(f.errP))}</li>`).join('')}</ul><button class="btn sm ghost" data-act="q-clear">${t('off.clear')}</button></div>` : ''}
  <div class="gcols"><div class="panel"><h2>${t('g.inside', { n: vis.length })}</h2>${vis.length ? `<ul class="glist">${vis.map(p => `<li class="lv-${guestState(p).level}"><div class="gl1">${photoImg(p)}${plate(p.plate, '', 'sm')}${kindChip(p)}${countdown(p)}</div><div class="gl2"><span>${kindOf(p) === 'guest' ? `${esc(p.home)} · ${esc(dt(p.name))}${p.slot ? ' · ' + esc(p.slot) : ''}` : esc(p.company || p.name || '')}</span><span class="btns">${kindOf(p) === 'guest' ? callBtn(p.home) : ''}<button class="btn sm" data-act="g-exit" data-v="${esc(p.plate)}">${t('g.exit')}</button></span></div></li>`).join('')}</ul>` : `<p class="empty">${t('vs.none')}</p>`}</div>
  <div class="panel"><h2>${t('g.expected', { n: exp.length })}</h2>${exp.length ? `<ul class="glist">${exp.map(p => `<li><div class="gl1">${p.plate ? plate(p.plate, '', 'sm') : `<span class="muted sm">${t('hd.noplate')}</span>`}<span>${esc(dt(p.name))}</span></div><div class="gl2"><span>${esc(p.home)} · ${t('g.until', { t: fmtT(p.expectUntil) })}</span><button class="btn sm ghost" data-act="g-find" data-v="${esc(p.code)}">${t('g.open')}</button></div></li>`).join('')}</ul>` : `<p class="empty">${t('vs.noexp')}</p>`}
  <h3>${t('g.parking')}</h3><p>${t('g.temp', { n: tempUsed(), cap: S.settings.tempCap })}</p>${meter(tempUsed(), S.settings.tempCap)}<p>${t('g.vis', { n: visUsed(), cap: S.settings.visitorCap })}</p>${meter(visUsed(), S.settings.visitorCap)}
  <h3>${t('g.recent')}</h3><ul class="elist">${S.events.slice(-6).reverse().map(evRow).join('') || `<li class="empty">${t('hd.noact')}</li>`}</ul></div></div>`;
}
const entryToast = ev => (ev ? t('g.in.done', { plate: ev.plate, where: locText(ev) }) : t('off.queued'));
async function gateDone(r, msg) { if (!r) return; if (!r.queued) toast(msg || entryToast(r.ev), 'ok'); UI.gq = ''; render(); const g = $('#gq'); if (g) g.focus(); }
ACT['g-enter'] = async v => gateDone(await act('enterMember', { plate: v }, { queue: true, noRender: true }));
ACT['g-pass'] = async v => { const ps = D.pass[v]; const pl = ps && !ps.plate ? val('passPlate') : undefined; if (ps && !ps.plate && !PLATE_RE.test(pl || '')) { toast(t('gp.e.plate'), 'bad'); return; } gateDone(await act('enterPass', { code: v, plate: pl }, { queue: true, noRender: true })); };
ACT['g-svc'] = async v => gateDone(await act('service', { id: +v }, { queue: true, noRender: true }));
ACT['g-exit'] = async v => { const r = await act('exit', { plate: v }, { queue: true, noRender: true }); gateDone(r, r && r.ev ? t('g.out.done', { plate: v, d: fmtDur(r.ev.dur || 0) }) : null); };
ACT['sec-exit'] = ACT['g-exit'];
ACT['g-deny'] = async v => gateDone(await act('deny', { plate: v }, { noRender: true }), t('g.denied', { plate: v }));
ACT['g-passback'] = v => confirmModal(t('g.passback.t'), t('g.passback.p', { plate: esc(v) }), 'g-passback-go', v, t('g.passback.go'));
ACT['g-passback-go'] = async v => { closeModal(); gateDone(await act('passback', { plate: v }, { noRender: true }), t('g.passback.done', { plate: v })); };
ACT['g-find'] = v => { UI.gq = v; render(); };
ACT['q-clear'] = () => { writeQ([], QFAIL); render(); };

/* ----- walk-in visitor: the guard calls the host first (phase 1 has no LINE) ----- */
ACT['g-walkin'] = v => {
  MODAL = { kind: 'form' }; UI.photo = null;
  showModal(`${mhead(t('wk.title2'))}<div class="mb form">
    <div class="f2"><label>${t('vf.plate')}<input id="wPlate" maxlength="20" value="${esc(v || '')}" ${v ? '' : 'data-focus'} autocomplete="off"></label><label>${t('f.province')}<select id="wProv">${provOpts('กรุงเทพมหานคร')}</select></label></div>
    <label>${t('wk.home')}<input id="wHome" list="homeIds" maxlength="24" data-inp="wHome" autocomplete="off" ${v ? 'data-focus' : ''}></label><p id="wInfo" class="hint">${t('wk.homehint')}</p>
    <div class="btnrow tight"><button class="btn ghost" data-act="w-call">${t('wk.call')}</button></div>
    <div class="f2"><label>${t('wk.name')}<input id="wName" maxlength="60"></label><label>${t('f.purpose')}<select id="wPurpose">${purposeOpts('Family visit')}</select></label></div>
    ${photoField()}<p class="hint">${t('wk.photohint2')}</p>
    <label class="check strong"><input id="wConf" type="checkbox"> ${t('wk.confirmed')}</label>
    <p id="wErr" class="err" role="alert"></p></div>${mfoot(`<button class="btn ink" data-act="w-go">${t('wk.go')}</button>`)}`);
};
INP.wHome = v => homeInfo(v, 'wInfo');
ACT['w-call'] = () => { const h = findHome(val('wHome')); if (!h) return setErr('wErr', 'wk.e.home'); callHost(h); };
ACT['w-go'] = async () => {
  const p = { plate: val('wPlate'), prov: val('wProv'), home: val('wHome'), name: val('wName'), purpose: val('wPurpose'), confirmed: $('#wConf').checked };
  if (!PLATE_RE.test(p.plate)) return setErr('wErr', 'wk.e.plate');
  const pre = plateCheck(p.plate); if (pre) return setErr('wErr', pre);
  if (!findHome(p.home)) return setErr('wErr', 'wk.e.home');
  if (!p.confirmed) return setErr('wErr', 'wk.e.conf');
  const ph = await uploadPhoto(); if (ph.failed) return;
  if (ph.id) p.photo = ph.id;
  const r = await act('walkin', p, { queue: true, noRender: true, photoData: ph.data });
  if (!r) return; closeModal(); gateDone(r, r.ev ? t('wk.done', { plate: p.plate, where: locText(r.ev) }) : null);
};

/* ----- delivery: no host, short time limit, photo of the vehicle ----- */
ACT['g-delivery'] = v => {
  MODAL = { kind: 'form' }; UI.photo = null;
  const cos = S.settings.companies || [];
  showModal(`${mhead(t('dl.title'))}<div class="mb form">
    <div class="f2"><label>${t('vf.plate')}<input id="dPlate" maxlength="20" value="${esc(v || '')}" ${v ? '' : 'data-focus'} autocomplete="off"></label><label>${t('f.province')}<select id="dProv">${provOpts('กรุงเทพมหานคร')}</select></label></div>
    <label>${t('dl.company')}<select id="dCompany" ${v ? 'data-focus' : ''}>${cos.map(c => opt(c, dt(c), false)).join('')}</select></label>
    <label>${t('dl.homes')}<input id="dHomes" maxlength="120" placeholder="${esc(t('dl.homesph'))}" autocomplete="off"></label>
    <label>${t('dl.note')}<input id="dNote" maxlength="80"></label>
    ${photoField()}<p class="hint">${t(S.settings.deliveryPhotoRequired ? 'dl.photoreq' : 'dl.photoopt', { n: S.settings.deliveryLimitMin })}</p>
    <p id="dErr" class="err" role="alert"></p></div>${mfoot(`<button class="btn ink" data-act="d-go">${t('dl.go')}</button>`)}`);
};
ACT['d-go'] = async () => {
  const p = { plate: val('dPlate'), prov: val('dProv'), company: val('dCompany'), homes: val('dHomes').split(/[,\s]+/).filter(Boolean), note: val('dNote') };
  if (!PLATE_RE.test(p.plate)) return setErr('dErr', 'wk.e.plate');
  const pre = plateCheck(p.plate); if (pre) return setErr('dErr', pre);
  for (const h of p.homes) if (!findHome(h)) return setErr('dErr', 'dl.e.home', { v: h });
  if (S.settings.deliveryPhotoRequired && !UI.photo) return setErr('dErr', 'dl.e.photo');
  const ph = await uploadPhoto(); if (ph.failed) return;
  if (ph.id) p.photo = ph.id;
  const r = await act('delivery', p, { queue: true, noRender: true, photoData: ph.data });
  if (!r) return; closeModal(); gateDone(r, r.ev ? t('dl.done', { plate: p.plate, n: S.settings.deliveryLimitMin }) : null);
};

boot();

</script>
</body></html>
